name: Deploy Wedding Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/wedding/web/**"
      - ".github/workflows/wedding-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "apps/wedding/web/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm --dir apps/wedding/web install

      - name: Type-check
        run: pnpm --dir apps/wedding/web run check

      - name: Run unit & component tests
        run: pnpm --dir apps/wedding/web run test

      - name: Build production bundle
        run: pnpm --dir apps/wedding/web run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/wedding/web/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
