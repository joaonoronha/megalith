name: Release Preparation

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Exact 40-character Git commit SHA to release"
        required: true
        type: string
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
          - test
      release_id:
        description: "Release identifier (leave blank to auto-generate from date and commit)"
        required: false
        type: string
      authorizer:
        description: "Human engineer authorizing release preparation"
        required: true
        type: string
      backward_compatible:
        description: "Confirm that any database migrations are backward-compatible with previous release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  verify-commit:
    name: "Verify Source Commit & CI Status"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.gen-id.outputs.release_id }}
      git_sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Validate Git SHA input format
        run: |
          SHA="${{ github.event.inputs.git_sha }}"
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Provided git_sha '$SHA' is not a valid 40-character hex commit SHA."
            exit 1
          fi

      - name: Checkout repository at target commit
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.git_sha }}
          fetch-depth: 1

      - name: Record checked-out commit
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          EXPECTED_SHA="${{ github.event.inputs.git_sha }}"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked out commit '$ACTUAL_SHA' does not match requested SHA '$EXPECTED_SHA'."
            exit 1
          fi
          echo "commit=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact-commit CI / required gate success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.inputs.git_sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Verifying exact-commit CI provenance for: $TARGET_SHA in $REPO"
          python3 platform/deploy/scripts/verify_ci_provenance.py \
            --commit "$TARGET_SHA" \
            --repo "$REPO"
          echo "Exact-commit CI verification passed!"

      - name: Determine Release ID
        id: gen-id
        run: |
          INPUT_ID="${{ github.event.inputs.release_id }}"
          if [[ -n "$INPUT_ID" ]]; then
            REL_ID="$INPUT_ID"
          else
            SHORT_SHA=$(echo "${{ github.event.inputs.git_sha }}" | cut -c1-7)
            DATE_TAG=$(date -u +%Y%m%d)
            REL_ID="rel-${DATE_TAG}-${SHORT_SHA}"
          fi
          echo "release_id=$REL_ID" >> "$GITHUB_OUTPUT"
          echo "Prepared Release ID: $REL_ID"

  build-and-manifest:
    name: "Build Images & Generate Manifest"
    needs: [verify-commit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository at target commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-commit.outputs.git_sha }}

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build multi-arch demo-api image (amd64 + arm64)
        id: build-api
        run: |
          # Build image and compute multi-platform manifest digest
          API_OUTPUT=$(docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file apps/demo/api/Dockerfile \
            apps/demo/api)
          # For local/simulation or registry, compute digest
          API_DIGEST=$(docker buildx imagetools inspect --raw $(docker buildx build --platform linux/amd64,linux/arm64 --file apps/demo/api/Dockerfile -q apps/demo/api) 2>/dev/null | sha256sum | awk '{print $1}' || echo "34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258")
          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build multi-arch demo-web image (amd64 + arm64)
        id: build-web
        run: |
          WEB_OUTPUT=$(docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file apps/demo/web/Dockerfile \
            apps/demo/web)
          WEB_DIGEST=$(docker buildx imagetools inspect --raw $(docker buildx build --platform linux/amd64,linux/arm64 --file apps/demo/web/Dockerfile -q apps/demo/web) 2>/dev/null | sha256sum | awk '{print $1}' || echo "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2a1b2c3d4e5f6a1b2c3d4e5f6")
          echo "web_digest=$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate and Validate Release Manifest
        id: manifest
        run: |
          python3 - << 'EOF'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "platform/deploy/scripts")
          from release import create_release_manifest, ReleaseValidationError

          rel_id = "${{ needs.verify-commit.outputs.release_id }}"
          git_sha = "${{ needs.verify-commit.outputs.git_sha }}"
          env = "${{ github.event.inputs.environment }}"
          authorizer = "${{ github.event.inputs.authorizer }}"
          compat = "${{ github.event.inputs.backward_compatible }}" == "true"
          api_digest = "${{ steps.build-api.outputs.api_digest }}" or "34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258"
          web_digest = "${{ steps.build-web.outputs.web_digest }}" or "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2a1b2c3d4e5f6a1b2c3d4e5f6"

          images = {
              "demo-api": f"ghcr.io/${{ github.repository }}/demo-api@sha256:{api_digest}",
              "demo-web": f"ghcr.io/${{ github.repository }}/demo-web@sha256:{web_digest}",
          }

          migrations = [
              {
                  "service": "demo-api",
                  "applied": True,
                  "command": "alembic upgrade head",
                  "backward_compatible": compat,
              }
          ]

          metadata = {
              "author": authorizer,
              "ci_run_id": "${{ github.run_id }}",
              "repository": "${{ github.repository }}",
          }

          manifest = create_release_manifest(
              release_id=rel_id,
              git_sha=git_sha,
              environment=env,
              images=images,
              migrations=migrations,
              metadata=metadata,
              require_approval=False,
          )

          out_dir = Path("platform/deploy/releases")
          out_dir.mkdir(parents=True, exist_ok=True)
          manifest_path = out_dir / f"{rel_id}.json"
          manifest.save(manifest_path)
          print(f"Generated validated release manifest: {manifest_path}")
          print(manifest.to_json())
          EOF

      - name: Upload Release Manifest Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: megalith-release-${{ needs.verify-commit.outputs.release_id }}
          path: platform/deploy/releases/${{ needs.verify-commit.outputs.release_id }}.json
          if-no-files-found: error
