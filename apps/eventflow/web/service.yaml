# Service manifest for eventflow/web
# Framework: Next.js 15
# Local development port: 3000
id: web
product: eventflow
type: web
runtime:
  language: typescript
  version: "5.x"
  framework: Next.js
path: apps/eventflow/web
commands:
  dev:
    - pnpm
    - dev
  test:
    - pnpm
    - test
  build:
    - pnpm
    - build
  check:
    - pnpm
    - check
artifact:
  type: static
deployment:
  deployable: true
  target: static
