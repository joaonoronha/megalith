# Service manifest for dashboard/web
# Production: Static build served via hosting / ingress
# Local development port: 5176 (Vite)
id: web
product: dashboard
type: web
runtime:
  language: typescript
  version: "5.x"
  framework: React
path: apps/dashboard/web
commands:
  dev:
    - pnpm
    - dev
  test:
    - pnpm
    - test
  build:
    - pnpm
    - build
  check:
    - pnpm
    - check
artifact:
  type: static
deployment:
  deployable: true
  target: static
