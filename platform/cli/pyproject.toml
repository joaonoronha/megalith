[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megalith-cli"
version = "0.1.0"
description = "Megalith Monorepo Developer Platform CLI"
authors = [{ name = "Megalith Platform" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.20.0",
]

[project.scripts]
megalith = "megalith.main:app"
