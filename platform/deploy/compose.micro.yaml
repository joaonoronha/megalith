# Micro Deployment Profile for Megalith Host & Ingress Validation
# Intended strictly for constrained experimental VMs (e.g. GCP e2-micro with ~1 GB RAM).
# Validates host bootstrap, Docker runtime, ingress ports (80/443), and basic HTTP health.
#
# STRICT POLICY NOTICE:
# This profile is FORBIDDEN for production environments. It does NOT run PostgreSQL,
# migrations, FastAPI backend, persistent databases, or backup pipelines.
# A passing smoke test under this profile DOES NOT prove production readiness.

services:
  caddy:
    image: caddy:2.9-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    restart: unless-stopped
    ports:
      - "${INGRESS_PORT:-80}:80"
      - "${INGRESS_SSL_PORT:-443}:443"
    environment:
      DEMO_HOSTNAME: ${DEMO_HOSTNAME:-demo.example.com}
    volumes:
      - ./caddy/Caddyfile.micro:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge-network:
        ipv4_address: 172.28.0.10
    depends_on:
      demo-web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  demo-web:
    build:
      context: ../../apps/demo/web
      dockerfile: Dockerfile
    image: ${IMAGE_DEMO_WEB:-megalith-demo-web:local}
    restart: unless-stopped
    networks:
      - edge-network
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - "http://127.0.0.1:8080/"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

networks:
  edge-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy-data:
  caddy-config:
