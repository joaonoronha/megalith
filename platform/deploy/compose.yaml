services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: postgres
      DEMO_DB_NAME: ${DEMO_DB_NAME:-db_demo}
      DEMO_DB_MIGRATE_USER: ${DEMO_DB_MIGRATE_USER:-role_demo_migrate}
      DEMO_DB_MIGRATE_PASSWORD: ${DEMO_DB_MIGRATE_PASSWORD:-demo_migrate_dev_password}
      DEMO_DB_APP_USER: ${DEMO_DB_APP_USER:-role_demo_app}
      DEMO_DB_APP_PASSWORD: ${DEMO_DB_APP_PASSWORD:-demo_app_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  demo-migrate:
    build:
      context: ../../apps/demo/api
      dockerfile: Dockerfile
    image: ${IMAGE_DEMO_API:-megalith-demo-api:local}
    restart: "no"
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_MIGRATE_URL: ${DATABASE_MIGRATE_URL:-postgresql+psycopg://role_demo_migrate:demo_migrate_dev_password@postgres:5432/db_demo}
    networks:
      - data-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      disable: true

  demo-api:
    build:
      context: ../../apps/demo/api
      dockerfile: Dockerfile
    image: ${IMAGE_DEMO_API:-megalith-demo-api:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      demo-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://role_demo_app:demo_app_dev_password@postgres:5432/db_demo}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,172.28.0.0/24}
    networks:
      - edge-network
      - data-network
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  demo-web:
    build:
      context: ../../apps/demo/web
      dockerfile: Dockerfile
    image: ${IMAGE_DEMO_WEB:-megalith-demo-web:local}
    restart: unless-stopped
    depends_on:
      demo-api:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    networks:
      - edge-network
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - "http://127.0.0.1:8080/"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

volumes:
  postgres-data:

networks:
  edge-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
  data-network:
    driver: bridge
