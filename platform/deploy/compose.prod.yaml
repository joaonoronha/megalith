# Production Docker Compose Overlay for Megalith Edge Ingress
# Applied with: docker compose -f compose.yaml -f compose.prod.yaml

services:
  caddy:
    image: caddy:2.9-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEMO_HOSTNAME: ${DEMO_HOSTNAME:-demo.example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge-network
    depends_on:
      demo-web:
        condition: service_healthy
      demo-api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  demo-web:
    # In production, demo-web does NOT publish a host port.
    # Caddy serves as the sole external ingress point on the host.
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
